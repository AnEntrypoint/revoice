[workspace]
resolver = "2"
members = ["crates/resound-core", "crates/resound-wasm"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
candle-core = { version = "0.10", features = ["cuda"] }
candle-nn = { version = "0.10", features = ["cuda"] }
rustfft = "6"
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
