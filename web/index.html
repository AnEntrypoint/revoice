<!doctype html>
<html>
<head><meta charset="utf-8"><title>resound wasm check</title></head>
<body>
<script type="module">
import init, { resound_version, resample_to_44100, mel_spectrogram_frames, denoise, enhance } from './resound_wasm.js';

async function run() {
  try {
  await init();
  const version = resound_version();
  const sine = new Float32Array(4410);
  for (let i = 0; i < sine.length; i++) sine[i] = 0.3 * Math.sin(2 * Math.PI * 440 * i / 44100);

  const weightResp = await fetch('./test_weights.safetensors');
  const weightBytes = new Uint8Array(await weightResp.arrayBuffer());

  let denoiseResult = null;
  let denoiseError = null;
  try {
    denoiseResult = denoise(sine, weightBytes);
  } catch (e) {
    denoiseError = String(e);
  }

  let enhanceResult = null;
  let enhanceError = null;
  try {
    enhanceResult = enhance(sine, weightBytes, 4, 0.5);
  } catch (e) {
    enhanceError = String(e);
  }

  window.__resoundCheck = {
    version,
    weightBytesLen: weightBytes.length,
    denoiseOutputLen: denoiseResult ? denoiseResult.length : null,
    denoiseError,
    enhanceOutputLen: enhanceResult ? enhanceResult.length : null,
    enhanceError,
  };
  console.log('resound_check', JSON.stringify(window.__resoundCheck));
  } catch (e) {
    window.__resoundCheck = { fatalError: String(e && e.stack ? e.stack : e) };
    console.log('resound_check_fatal', JSON.stringify(window.__resoundCheck));
  }
}
run();
</script>
</body>
</html>
